<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">O</div>
      <div class="brand-text">
        <span class="brand-name">On-Class</span>
      </div>
    </div>
    <nav class="nav">
      @for (n of nav; track n.href) {
        <a [routerLink]="n.href" routerLinkActive="active" class="nav-link">
          <span>{{ n.label }}</span>
          <span class="nav-count">{{ count(n.href) }}</span>
        </a>
      }
    </nav>
    <div class="sidebar-foot">
      <button type="button" class="site-link logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
<app-toast></app-toast>
