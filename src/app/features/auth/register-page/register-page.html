<div class="login-page">
  <form class="login-card" (ngSubmit)="submit()">
    <h1>Crear cuenta</h1>
    <p class="login-subtitle">Regístrate para comenzar a usar la plataforma.</p>

    <label class="field">
      <span class="field-head">Nombre</span>
      <input
        type="text"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        name="name"
        placeholder="Tu nombre"
        required
      />
    </label>

    <label class="field">
      <span class="field-head">Correo</span>
      <input
        type="email"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        name="email"
        placeholder="tu@correo.com"
        required
      />
    </label>

    <label class="field">
      <span class="field-head">Contraseña</span>
      <input
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
        placeholder="••••••••"
        required
      />
    </label>

    <label class="field">
      <span class="field-head">Fecha de nacimiento</span>
      <input
        type="date"
        [ngModel]="birthDate()"
        (ngModelChange)="birthDate.set($event)"
        name="birthDate"
        required
      />
    </label>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <button class="btn-submit" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creando cuenta…' : 'Registrarme' }}
    </button>

    <p class="login-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</div>
