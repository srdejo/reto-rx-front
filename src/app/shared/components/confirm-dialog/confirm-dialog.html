@if (open()) {
  <div class="backdrop" (click)="requestCancel()"></div>
  <div class="modal">
    <h2>{{ title() }}</h2>
    <ng-content></ng-content>
    <div class="actions">
      <button class="btn-ghost" type="button" [disabled]="loading()" (click)="requestCancel()">Cancelar</button>
      <button class="btn-danger" type="button" [disabled]="loading()" (click)="requestConfirm()">
        {{ loading() ? loadingLabel() : confirmLabel() }}
      </button>
    </div>
  </div>
}
