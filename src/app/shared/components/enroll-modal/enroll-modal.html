@if (bootcamp(); as b) {
  <div class="backdrop" (click)="close()"></div>
  <div class="modal">
    @if (!done()) {
      <div class="head">
        <h2>{{ b.name }}</h2>
        <span class="range">{{ range() }}</span>
      </div>
      <label class="field">
        Nombre completo
        <input [ngModel]="name()" (ngModelChange)="name.set($event)" />
      </label>
      <label class="field">
        Correo
        <input type="email" placeholder="tu@correo.com" [ngModel]="email()" (ngModelChange)="email.set($event)" />
      </label>
      <label class="field">
        Fecha de nacimiento
        <input type="date" [max]="todayIso" [ngModel]="birthDate()" (ngModelChange)="birthDate.set($event)" />
      </label>
      <span class="error">{{ error() }}</span>
      <div class="actions">
        <button class="btn-ghost" type="button" (click)="close()">Cancelar</button>
        <button class="btn-primary" type="button" (click)="submit()">Confirmar inscripción</button>
      </div>
    } @else {
      <span class="confirmed">INSCRIPCIÓN CONFIRMADA</span>
      <h2>Te inscribiste en {{ b.name }}</h2>
      <p class="range">{{ range() }} · {{ activeCount() }}</p>
      <button class="btn-dark" type="button" (click)="close()">Listo</button>
    }
  </div>
}
