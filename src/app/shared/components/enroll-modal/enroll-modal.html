@if (bootcamp(); as b) {
  <div class="backdrop" (click)="close()"></div>
  <div class="modal">
    @if (!done()) {
      <div class="head">
        <h2>{{ b.name }}</h2>
        <span class="range">{{ range() }}</span>
      </div>
      <p class="range">¿Confirmas tu inscripción en este bootcamp?</p>
      <span class="error">{{ error() }}</span>
      <div class="actions">
        <button class="btn-ghost" type="button" (click)="close()">Cancelar</button>
        <button class="btn-primary" type="button" [disabled]="submitting()" (click)="submit()">
          {{ submitting() ? 'Inscribiendo…' : 'Confirmar inscripción' }}
        </button>
      </div>
    } @else {
      <span class="confirmed">INSCRIPCIÓN CONFIRMADA</span>
      <h2>Te inscribiste en {{ b.name }}</h2>
      <p class="range">{{ range() }}</p>
      <button class="btn-dark" type="button" (click)="close()">Listo</button>
    }
  </div>
}
