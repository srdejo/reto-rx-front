@if (open()) {
  <div class="backdrop" (click)="requestClose()"></div>
  <aside class="drawer">
    <div class="drawer-head">
      <h2>{{ title() }}</h2>
      <button class="close-btn" type="button" [disabled]="loading()" (click)="requestClose()">×</button>
    </div>
    <div class="drawer-body">
      <ng-content></ng-content>
    </div>
    @if (showFooter()) {
      <div class="drawer-foot">
        <button class="btn-ghost" type="button" [disabled]="loading()" (click)="requestClose()">Cancelar</button>
        <button class="btn-primary" type="button" [disabled]="loading()" (click)="requestSubmit()">
          {{ loading() ? loadingLabel() : submitLabel() }}
        </button>
      </div>
    }
  </aside>
}
